<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Case Manager</title>
    <style>
      /* Painted before any JS, into a window that is already on screen with
         this same colour (backgroundColor in tauri.conf.json): no white
         flash, and the splash is what a launch shows until the app is ready
         (src/lib/splash.ts). */
      /* Deep violet-tinted near-black to match the violet flask mark. */
      html, body { margin: 0; height: 100%; background: #0e0c1c; }
      #splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: #0e0c1c; z-index: 9999;
      }
      /* Everything is there from the first paint: a normal launch shows this
         for well under a second (App.tsx takes it away once it knows who is
         signed in), so a flask that drew itself in, or a name that faded
         in, was never seen. Only the bar moves. */
      #splash svg { width: 64px; height: 64px; stroke: #8b5cf6; fill: none;
        stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      #splash span { font: 600 13px 'Segoe UI', system-ui, sans-serif;
        color: #a5a0c2; letter-spacing: .04em; }
      #splash::after { content: ''; width: 120px; height: 2px; border-radius: 2px;
        background: linear-gradient(90deg, transparent, #8b5cf6, transparent);
        background-size: 200% 100%; animation: sweep 1.2s linear infinite; }
      @keyframes sweep  { from { background-position: 200% 0; } to { background-position: -200% 0; } }
      @media (prefers-reduced-motion: reduce) { #splash::after { animation: none; } }
    </style>
  </head>

  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path class="flask-top" d="M9 3h6" />
        <path class="flask-body" d="M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3" />
        <path class="flask-line" d="M7.5 14h9" />
      </svg>
      <span>TEST CASE MANAGER</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# SonarQube Cloud automatic analysis (the owner's private copy of this repository).
# What is ours to analyse: the app's frontend and its Rust backend. Tests are
# analysed as tests, not as product code.
sonar.sources=src,src-tauri/src,scripts,docs-site/src
sonar.tests=tests,src-tauri/tests

# Generated or copied code - never edited by hand here, so never fixed here:
# the TypeScript bindings (generated from the Rust commands), the built How To
# Use site, the Playwright repository's rules snapshot, the report engine copy,
# and the vendored third-party page.
sonar.exclusions=src/bindings.ts,src-tauri/help/**,src-tauri/pw-rules/**,crystal-reports/**,public/vendor/**,**/node_modules/**,**/dist/**,src-tauri/target/**

sonar.sourceEncoding=UTF-8

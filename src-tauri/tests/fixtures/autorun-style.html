<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Auto Run style fixture</title>
<style>
  :root { --brand: #123; }
  #plain { color: red; background-color: #ff000080; display: block; box-shadow: 0 1px 2px black; font-family: "Segoe UI", Arial; }
  #fade { color: rgb(0, 0, 0); transition: color 1.5s linear; }
  #fade.done { color: blue; }
  @keyframes pulse { from { color: black; } to { color: gray; } }
  #pulse { animation: pulse 0.5s infinite alternate; }
</style>
</head>
<body>
  <p id="plain">Plain</p>
  <p id="fade">Fading</p>
  <p id="pulse">Pulsing</p>
  <button id="go" onclick="document.getElementById('fade').classList.add('done')">Fade</button>
</body>
</html>

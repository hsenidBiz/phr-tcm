<title>Auto Run second fixture</title>
<!--
  A second page sitting BESIDE the main fixture, so a relative `navigate`
  has somewhere real to land. Scripts have always been able to write
  "/dashboard" or a bare file name; the page resolves it against its own
  address, and only the resolved address reaches the browser.
-->
<h1 id="second">Second fixture</h1>

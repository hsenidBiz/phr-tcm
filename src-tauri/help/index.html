epository",shot:I,locate:{role:"button",name:"Add repository"},name:"Add repository",does:"Opens a folder picker. The folder you pick is added to the list and becomes the current repository."},{id:"rescan",shot:I,locate:{role:"button",name:"Rescan"},name:"Rescan",does:"Looks again for the AI tools installed on this computer and says how many it found. Use it after installing one, without restarting the app."},{id:"registered",shot:I,locate:{text:"Registered ✓"},name:"Installed AI tools",does:"Each AI tool found on this computer, with where its settings are read from (**in this repo**, or **global** for machine-wide) and whether this app's tools are registered with it."},{id:"unregister",shot:I,locate:{role:"button",name:"Unregister"},name:"Unregister",does:"Removes this app's tools from that AI tool's settings."},{id:"register",shot:I,locate:{role:"button",name:"Register"},name:"Register",does:"Adds this app's tools to that AI tool's settings, in the current repository (or machine-wide, when you chose that). An assistant that is already running may need its session restarted to see them."},{id:"retire-global",shot:I,locate:{role:"button",name:"Retire global copies"},name:"Retire global copies",does:"Shown under a tool that still has this app's tools registered machine-wide from before. A machine-wide copy can hide the repository's own in most assistants; this removes it."},{id:"other-tools",shot:I,locate:{text:"Other tools"},name:"Other tools",does:"For an assistant the app does not detect: opens a command line and a settings snippet you can copy and add yourself."},{id:"tool-count",shot:I,locate:{text:"6 of 6 on"},name:"Tools an assistant may use",does:"How many of the tools below are switched on. The tools every writing job needs (the writing guide, reading cases, checking a draft and similar) are always on and not listed."},{id:"tool-switch",shot:I,locate:{role:"switch",name:"Test Suites"},name:"Tool switch",does:"Switch a tool off to keep it out of an assistant's reach: Test Suites, Run failures, Company database (read), Project tags, Find a PBI and Project wiki. A connected assistant sees the change without being restarted."},{id:"database",shot:I,locate:{role:"combobox",name:"Database"},name:"Database",does:"The company database this app's own database tools read, when **Company database (read)** is switched on. The x clears the choice."},{id:"signs-in-as",shot:I,locate:{text:"Signs in as portal_devlogin"},name:"Signs in as",does:"The user the chosen database signs in as, or **No login saved**. The password is never shown."},{id:"manage-credentials",shot:I,locate:{role:"button",name:"Manage credentials"},name:"Manage credentials",does:"Opens the login of the chosen database. Greyed out until a database is chosen."},{id:"writes",shot:I,locate:{role:"switch",name:"Create, update and delete"},name:"Create, update and delete",does:"Lets an assistant change data in the chosen database, not only read it. It is off until you turn it on, it can only be turned on for a dev login database (a user ending in _devlogin), and every statement is written to the app's log."},{id:"forget",shot:I,locate:{role:"button",name:"Forget them"},name:"Forget them",does:"Removes the database logins saved on this computer (they are kept in Windows Credential Manager), clears the card's settings and the chosen database, and turns **Create, update and delete** off."},{id:"breakdown",shot:I,locate:{role:"heading",name:"AI Tools Breakdown"},name:"AI Tools Breakdown",does:"What each tool you can switch does, and the recommended way to have an assistant write test cases for a PBI."},{id:"copy-command",shot:it,locate:{role:"button",name:"Copy command"},name:"Copy (command line)",does:"Copies the command that registers this app's tools with Claude Code. Run it inside the repository."},{id:"copy-config",shot:it,locate:{role:"button",name:"Copy config"},name:"Copy (config)",does:"Copies the settings snippet to paste into another assistant's tool settings."},{ eantime.","Until a PBI is chosen, the test case screens show a short prompt and your recent PBIs instead of their usual content.","Settings has an interface tour that walks you through the app one screen at a time."],howTo:[{title:"Sign in",steps:["Open the app and press **Sign in with Microsoft**.","Finish signing in in the browser window that opens. Until you do, the button reads **Waiting for browser**.","Back in the app, choose your organisation, project and PBI in the bar across the top."]},{title:"Choose the PBI to work on",steps:["Press the **x** on the PBI in the bar, or start from a screen with no PBI chosen.","Click **Find PBI** and pick one of your recent PBIs, or type its number or part of its title.","Click the PBI. Every test case screen now works on it."]}]},A="import-file-queue",fe="import-file-open-case",dt="import-file-changes",Re="import-file-selected",he="import-file-bulk-edit",D="import-file-rename",ce="import-file-review",Oe="import-file-results",V="import-file-edit",$="Login - remember me keeps you signed in",ut="Login - valid credentials",so={id:"import-file",title:"Import File",group:"Test cases",summary:"Bring test cases in from a JSON file or a teammate's share link, check them in the queue, then upload them to the PBI. A case that carries an id updates that exact work item; a case without one is created new.",shots:[{id:A,route:[{nav:"Import File"}],alt:"Import File with three cases in the queue"},{id:fe,route:[{nav:"Import File"},{click:{role:"button",name:`Expand steps of ${$}`}}],alt:"A queued case opened to its steps"},{id:dt,route:[{nav:"Import File"},{click:{role:"button",nameRe:"^Click to view"}}],alt:"An update opened to what will change"},{id:V,route:[{nav:"Import File"},{click:{role:"button",name:`Edit ${$}`}},{waitFor:{role:"button",name:"Save to queue"}},{scrollTo:{role:"button",name:"Save to queue"}}],alt:"A queued case open for editing in the queue"},{id:Re,route:[{nav:"Import File"},{click:{role:"checkbox",name:`Select ${$}`}},{click:{role:"checkbox",name:`Select ${ut}`}}],alt:"Two queued cases ticked, with the bulk actions"},{id:he,route:[{nav:"Import File"},{click:{role:"checkbox",name:`Select ${$}`}},{click:{role:"checkbox",name:`Select ${ut}`}},{click:{role:"button",name:"Bulk edit"}},{waitFor:{role:"button",nameRe:"^Apply to \\d+$"}}],alt:"The Bulk edit window for two queued cases"},{id:D,route:[{nav:"Import File"},{click:{role:"button",name:"Rename"}},{waitFor:{role:"textbox",name:"Find"}}],alt:"The rename window for the queued cases"},{id:ce,route:[{nav:"Import File"},{click:{role:"button",nameRe:"^Review \\d+ test cases?$"}},{waitFor:{role:"button",name:"Create duplicates anyway"}},{scrollTo:{role:"button",nameRe:"^Yes . create"}}],alt:"Reviewing the queue before upload, stopped by a duplicate title"},{id:Oe,route:[{nav:"Import File"},{click:{role:"checkbox",name:`Select ${$}`}},{click:{role:"checkbox",name:`Select ${ut}`}},{click:{role:"button",name:"Remove 2"}},{click:{role:"button",nameRe:"^Review \\d+ test cases?$"}},{click:{role:"button",nameRe:"^Confirm & update"}},{waitFor:{role:"button",name:"Clear results"}}],alt:"The results of an upload"}],controls:[{id:"import-json",shot:A,locate:{role:"button",name:"Import JSON"},name:"Import JSON",does:"Opens a JSON file of test cases and adds its cases to the queue. The file is then watched: save a change to it and the change flows into the queue by itself.",tips:["With a working repository set on AI Bridge, a file from anywhere else is first copied into the repository's .test-cases folder, and the copy is the one watched."]},{id:"share-link",shot:A,locate:{role:"textbox",name:"Share link"},name:"Share link",does:"Paste a share link a teammate sent you. A link works once: after the import it expires."},{id:"import-shared",shot:A,locate:{role:"button",name:"Import shared"},name:"Import shared",does:"Fetches the shared draft and adds its cases to the queue. A copy is saved on this computer and watched like an imported file, so the ids an upload creates are kept.",tips:["A draft shared for a different PBI asks first: stay on the PBI you have chosen, or switch to the one it was shared for."]},{id:"queue-title",shot:A,locate:{text:"Queue for PBI #1001 (3 queued)"},name:"Queue for PBI",does:"Every case waiting to be uploaded to this PBI, and how many there are. The queue is shared with Manual Entry and kept on this computer for each PBI."},{id:"view-in-browser",shot:A,locate:{role:"button",name:"View in browser"},name:"View in browser",does:"Opens the queue as a review page in your browser, where you can read every case and leave comments. See **Use the review page** below."},{id:"share-for-review",shot:A,locate:{role:"button",name:"Share for review"},name:"Share for review",does:"Attaches the draft to the PBI in Azure DevOps as a file and copies a one-time link to it, ready to send to a reviewer, who imports it with **Import shared**. No test cases are created. It needs a connection, so it is greyed out while you are offline."},{id:"export-json",shot:A,locate:{role:"button",name:"Export JSON"},name:"Export JSON",does:"Saves the queue to a JSON file you choose."},{id:"rename",shot:A,locate:{role:"button",name:"Rename"},name:"Rename",does:"Opens the rename window for every queued title, or only the ticked ones when some are ticked."},{id:"remove-all",shot:A,locate:{role:"button",name:"Remove all"},name:"Remove all",does:"Empties the queue and stops watching the imported files. Nothing in Azure DevOps is touched."},{id:"order-testing",shot:A,locate:{role:"button",name:"For testing"},name:"Order: For testing",does:"Sorts the queue so cases that share a setup sit together. Offered when the cases carry an order, which an AI assistant adds when it optimises a draft. The queue's order is the order the cases are created in."},{id:"order-spec",shot:A,locate:{role:"button",name:"Down the spec"},name:"Order: Down the spec",does:"Sorts the queue to follow the specification document, so a reviewer can read both side by side."},{id:"select-all",shot:A,locate:{role:"checkbox",name:"Select all queued cases"},name:"Select cases for bulk actions",does:"Ticks every case, ready for a bulk action."},{id:"row-select",shot:A,locate:{role:"checkbox",name:`Select ${$}`},name:"A queued case",does:"One row per case. Its box ticks it for a bulk action; hold [[Shift]] and click another box to tick everything in between."},{id:"expand-steps",shot:A,locate:{role:"button",name:`Expand steps of ${$}`},name:"Show steps (>)",does:"Opens the case to its steps, with the preconditions and reviewer notes, exactly as they will be written."},{id:"update-badge",shot:A,locate:{text:"UPDATE #5002"},name:"NEW or UPDATE",does:"**NEW** means the case will be created. **UPDATE** and a number means it will change that existing test case."},{id:"what-changes",shot:A,locate:{role:"button",nameRe:"^Click to view"},name:"What will change",does:"For an update, how many fields, steps and step types will change compared with the case in Azure DevOps. Click it to see each change. A **no-op** mark means the upload would change nothing."},{id:"comment",shot:A,locate:{text:"Asked the team how long the sign-in should last."},name:"Comment",does:"A note about the case, from the file, the review page or the case's editor (**Edit**). It stays in the app and the file, and is never sent to Azure DevOps."},{id:"row-edit",shot:A,locate:{role:"button",name:`Edit ${$}`},name:"Edit",does:"Opens the case for changes right in the queue. See the editor below."},{id:"row-remove",shot:A,locate:{role:"button",name:`Remove ${$} from the queue`},name:"Remove",does:"Takes the case out of the queue, and out of the file it came from, so the file and the queue still agree."},{id:"review",shot:A,locate:{role:"button",nameRe:"^Review \\d+ test cases?$"},name:"Review",does:"Starts the final check before anything is written. It stays within reach at the bottom right while you scroll a long queue."},{id:"hide-steps",shot:fe,locate:{role:"button",name:`Collapse steps of ${$}`},name:"Hide steps (v)",does:"Closes the case again."},{id:"case-preconditions",shot:fe,locate:{text:"Preconditions:"},name:"Preconditions",does:"What must be true before the first step."},{id:"reviewer-notes",shot:fe,locate:{text:"Reviewer notes"},name:"Reviewer notes",does:"Notes for whoever reviews the draft, for example which part of the spec the case covers. They stay in the app and the review page."},{id:"steps-table",shot:fe,locate:{text:"Action"},name:"Steps",does:"Every step with its action and expected result, numbered in order."},{id:"collapse-all",shot:fe,locate:{role:"button",nameRe:"^Collapse all"},name:"Collapse all",does:"Closes every opened case at once. It shows while anything in the queue is open, with how many are."},{id:"what-changes-open",shot:dt,locate:{role:"button",nameRe:"^Click to view"},name:"What will change, opened",does:"Click it again to close the changes."},{id:"change-detail",shot:dt,locate:{text:"Title:"},name:"The changes",does:"Each field that will change, with the old and new wording marked word by word, and the steps that change."},{id:"editor-title",shot:V,locate:{role:"textbox",name:"Case title"},name:"Title",does:"The case's title. [[Enter]] here saves, like **Save to queue**."},{id:"editor-status",shot:V,locate:{role:"combobox",name:"Automation status"},name:"Automation status",does:"**Not Automated** or **Planned**."},{id:"editor-tags",shot:V,locate:{role:"textbox",name:"Tags"},name:"Tags",does:"The case's tags. Type to search the project's tags or add a new one."},{id:"editor-module",shot:V,locate:{role:"combobox",name:"Module"},name:"Module",does:"The module the case belongs to."},{id:"editor-preconditions",shot:V,locate:{role:"textbox",name:"Preconditions"},name:"Preconditions",does:"What must be true before the first step."},{id:"editor-comment",shot:V,locate:{role:"textbox",name:"Comment (in-app only)"},name:"Comment (in-app only)",does:"A note about the case. It is saved in the JSON file and never sent to Azure DevOps."},{id:"editor-steps",shot:V,locate:{role:"textbox",name:"Step 1 action"},name:"Steps",does:"The steps, edited the same way as on Manual Entry: drag to reorder, **Add Step**, and the x to remove one."},{id:"editor-save",shot:V,locate:{role:"button",name:"Save to queue"},name:"Save to queue",does:"Keeps your changes in the queue and in the file the case came from; nothing goes to Azure DevOps until the upload. It is greyed out until something changes, or while the case has a problem, which is named beside it."},{id:"editor-cancel",shot:V,locate:{role:"button",name:"Cancel"},name:"Cancel",does:"Closes the editor and drops the changes."},{id:"editor-close",shot:V,locate:{role:"button",name:`Close the editor for ${$}`},name:"Close",does:"While the editor is open, the row's **Edit** reads **Close** and closes it the same way."},{id:"selected-count",shot:Re,locate:{text:"2 of 3 selected"},name:"Selected",does:"How many cases are ticked."},{id:"bulk-edit",shot:Re,locate:{role:"button",name:"Bulk edit"},name:"Bulk edit",does:"Changes the automation status, module, tags or preconditions of every ticked case at once."},{id:"rename-selected",shot:Re,locate:{role:"button",name:"Rename 2"},name:"Rename",does:"Opens the rename window for the ticked cases only."},{id:"remove-selected",shot:Re,locate:{role:"button",name:"Remove 2"},name:"Remove",does:"Takes the ticked cases out of the queue."},{id:"bulk-status",shot:he,locate:{role:"combobox",name:"Automation status"},name:"Automation status",does:"Leave it unchanged, or set every ticked case to **Not Automated** or **Planned**."},{id:"bulk-module",shot:he,locate:{role:"checkbox",name:"Set module"},name:"Set module",does:"Tick it to choose one module for all of them."},{id:"bulk-tags",shot:he,locate:{role:"combobox",name:"Tags"},name:"Tags",does:"Leave tags unchanged, add tags to the ones each case already has, or replace them."},{id:"bulk-preconditions",shot:he,locate:{role:"checkbox",name:"Set preconditions"},name:"Set preconditions",does:"Tick it to give them all the same preconditions."},{id:"bulk-cancel",shot:he,locate:{role:"button",name:"Cancel"},name:"Cancel",does:"Closes the window without changing anything."},{id:"bulk-apply",shot:he,locate:{role:"button",nameRe:"^Apply to \\d+$"},name:"Apply",does:"Makes the changes. Titles and steps are never touched, and the file each case came from is updated to match."},{id:"rename-find",shot:D,locate:{role:"textbox",name:"Find"},name:"Find",does:"The text to look for in each title."},{id:"rename-replace",shot:D,locate:{role:"textbox",name:"Replace with"},name:"Replace with",does:"What to put in its place. Leave it empty to delete the text found."},{id:"rename-regex",shot:D,locate:{role:"checkbox",name:"Regular expression"},name:"Regular expression",does:"Treats **Find** as a pattern, so parts of it can be reused in the replacement as $1, $2 and so on."},{id:"rename-match-case",shot:D,locate:{role:"checkbox",name:"Match case"},name:"Match case",does:"Only finds text with the same capital and small letters."},{id:"rename-first-only",shot:D,locate:{role:"checkbox",name:"First match only"},name:"First match only",does:"Replaces only the first match in each title."},{id:"rename-prefix",shot:D,locate:{role:"textbox",name:"Prefix"},name:"Prefix",does:"Text added to the start of every title."},{id:"rename-suffix",shot:D,locate:{role:"textbox",name:"Suffix"},name:"Suffix",does:"Text added to the end of every title."},{id:"rename-capitalisation",shot:D,locate:{role:"combobox",name:"Capitalisation"},name:"Capitalisation",does:"Leave titles as they are, or change them to Title Case, UPPERCASE or lowercase."},{id:"rename-number-from",shot:D,locate:{role:"spinbutton",name:"Number from"},name:"Number from",does:"Where numbering starts. Put ${n} in the replacement, prefix or suffix to number the cases in the order shown."},{id:"rename-digits",shot:D,locate:{role:"spinbutton",name:"Number digits"},name:"Digits",does:"How many digits each number has, with zeros in front: 3 digits gives 001, 002 and so on."},{id:"rename-summary",shot:D,locate:{text:"0 will change"},name:"Preview",does:"The table above it shows every title now and after the rename, exactly as it will be saved. This line counts the changes, and warns when a new title would repeat another or cannot be saved."},{id:"rename-cancel",shot:D,locate:{role:"button",name:"Cancel"},name:"Cancel",does:"Closes the window without renaming. After a rename it reads **Done**."},{id:"rename-apply",shot:D,locate:{role:"button",nameRe:"^Rename \\d+$"},name:"Rename",does:"Renames the titles shown in the preview. Afterwards **Undo rename** puts them back."},{id:"check-pbi",shot:ce,locate:{testId:"pbi"},name:"Highlighted PBI",does:"While you confirm, the PBI glows, so you can check the new cases are going to the right place."},{id:"duplicate-hint",shot:ce,locate:{text:"A test case with this title already exists on the PBI - this will create a duplicate, not update it."},name:"Duplicate warning",does:"Marks a new case whose title is already used by a case on the PBI. Uploading it would make a second case, not update the first."},{id:"stop-back",shot:ce,locate:{role:"button",nameRe:"^Stop . take me back$"},name:"Stop, take me back",does:"Leaves the review so you can fix the queue: remove the duplicate, or import a file that includes the existing case's id so it is updated instead."},{id:"create-anyway",shot:ce,locate:{role:"button",name:"Create duplicates anyway"},name:"Create duplicates anyway",does:"Accepts the duplicates. Nothing is written yet; it only makes the upload button available."},{id:"confirm",shot:ce,locate:{role:"button",nameRe:"^Yes . create"},name:"Yes, create and update",does:"Uploads the queue. New cases are created, linked to the PBI and added to its test suite; cases with an id are updated. The button says how many of each, and stays greyed out while a duplicate waits for an answer or a case has a problem to fix. With only updates in the queue there is no PBI to check, so it reads **Confirm & update** and the number, and uploads at once."},{id:"back",shot:ce,locate:{role:"button",name:"Back"},name:"Back",does:"Leaves the review without uploading anything."},{id:"uploaded",shot:Oe,locate:{text:"UPLOADED"},name:"UPLOADED",does:"Marks a case the last upload wrote. It stays in the queue, now carrying its id, until you remove it."},{id:"results",shot:Oe,locate:{text:"1 test case uploaded - 1 updated"},name:"Results",does:"What the upload did, in one line, then every case with its id, marked **NEW**, **UPDATED**, **FAILED** or **UNKNOWN** (it may have been written; see the tips on held cases)."},{id:"copy-changes",shot:Oe,locate:{role:"button",name:"Copy changes"},name:"Copy changes",does:"Copies, for a tester, each updated case's id with what changed in it, followed by the ids and titles of the new cases, so they know what to run again."},{id:"clear-results",shot:Oe,locate:{role:"button",name:"Clear results"},name:"Clear results",does:"Hides the results and the marks they left on the rows."}],tips:["Only a case id updates a work item. A title that matches an existing case is a warning, never an update.","While a file is watched, a line under **Import JSON** names it and how many cases it added. **Stop** stops following that file (**Remove all** there stops every one) and asks whether to keep the cases it added or remove them too. Cases you typed by hand are never removed.","Under each watched file, **Attach spec…** adds specification documents (Markdown or text files) and **Add wiki link** adds an Azure DevOps wiki page. Both open beside the cases on the review page.","**General comments**, under the watched files, holds notes about the whole set, such as a question you asked a developer. They are saved into the file.","When a watched file changes, a panel says what was added, changed or removed, and the rows it touched are outlined in the queue. **Show details** lists each change; the x closes the panel.","With the queue empty, **Recent JSON Imports** lists files you imported before. **Open** imports one again as it is now; the x takes it off the list.","Warnings about an imported file, such as a field it could not read, are listed under the share link.","While an upload runs, a bar under the queue says what it is doing (checking what changed, then uploading) and how many cases are done.","If an upload is cut off before Azure DevOps answers, the cases it may have created are marked and uploading is held until you press **Check with Azure DevOps**, so nothing is created twice.","When a held case's title matches more than one test case in Azure DevOps, the app cannot tell which is yours. Check in Azure DevOps, then press **Release** and confirm, and the case can be uploaded again."],howTo:[{title:"Import a file and upload it",steps:["Choose the PBI in the bar at the top.","Press **Import JSON** and pick the file.","Check the queue: open a case with **>** to read its steps, and open **what will change** on each update.","Press **Review**. Deal with any duplicate or flagged case.","Check the highlighted PBI, then press the button that says what it will create and update."]},{title:"Use the review page",steps:["Press **View in browser**. The page opens in your browser, in the app's theme, with a switch for light and dark.","Every case is listed with its **NEW** or **UPDATE** mark. Search, and narrow the search to one field (title, ID, prerequisites, steps, tags or module).","Type in the comment box under a case, or in the notes about the whole set. They save by themselves into the file the cases came from.","Press the bookmark on a case to mark where you stopped; **Go to bookmark** brings you back to it later.","**Options** hides the reviewer notes, the findings or the spec pane, and opens the Test map with **View as Tree**.","Keep the page open: when the queue changes, a bar offers to refresh it."]},{title:"See the cases as a Test map",steps:["On the revie a computer that does not work from a repository: the AI Bridge tab then offers **Register in: This repository** or **Machine-wide**. Writing test cases still needs a repository."},{id:"offer-phrx",shot:De,locate:{role:"switch",name:"Offer the PHR X database server on the AI Bridge tab"},name:"Offer the PHR X database server",does:"Shows the settings for registering the company's own database server on the AI Bridge tab. Most people no longer need it."},{id:"log",shot:Ze,locate:{role:"heading",name:"App log"},name:"App log",does:"What the app has been doing, refreshed every few seconds while it is open. Include it when you report a bug. A file is kept for each day, for a week."},{id:"copy-log",shot:Ze,locate:{role:"button",name:"Copy log"},name:"Copy log",does:"Copies the whole log shown, to paste into a message."},{id:"open-log-folder",shot:Ze,locate:{role:"button",name:"Open log folder"},name:"Open log folder",does:"Opens the folder with the daily log files."},{id:"bug-title",shot:Me,locate:{role:"textbox",name:"Bug title"},name:"Bug title",does:"One line for the issue. Leave it blank to take it from the description."},{id:"what-happened",shot:Me,locate:{role:"textbox",name:"What happened"},name:"What happened",does:"What you were doing, and what happened instead."},{id:"bug-cancel",shot:Me,locate:{role:"button",name:"Cancel"},name:"Cancel",does:"Closes the window without reporting anything."},{id:"open-issue",shot:Me,locate:{role:"button",name:"Open the issue"},name:"Open the issue",does:"Opens a filled-in issue on GitHub in your browser, for you to check and submit, and opens the folder with a copy of the log. Drag that log file onto the issue before submitting. Nothing is sent from the app, and your organisation, project and work item names are removed from the log first."}],tips:["Settings can also be opened from the command palette: press [[Ctrl+K]] and pick **Settings**."]},F="suite-management-plan",ve="suite-management-selected",qe="suite-management-grouped" hot:F,locate:{role:"switch",name:"Group by title"},name:"Group by title",does:"Shows a heading over each run of cases whose titles start the same way, and puts each group's cases together. That rearranges the list, so **Apply order** lights up when anything moved. Turning it off only hides the headings. The choice is remembered."},{id:"apply-order",shot:F,locate:{role:"button",name:"Apply order"},name:"Apply order",does:"Saves the order on screen to the suite in Azure DevOps. It is greyed out until the order has changed."},{id:"reset",shot:F,locate:{role:"button",name:"Reset"},name:"Reset",does:"Puts the list back in the suite's saved order. It is greyed out until the order has changed."},{id:"order-from-files",shot:F,locate:{role:"button",name:"Apply order from files"},name:"Apply order from files",does:"Orders the suite by draft files you pick: each file's cases become one block, in the file's own order. See the tips below."},{id:"count",shot:F,locate:{text:"5 test cases"},name:"Cases",does:"How many cases the suite holds, or how many of them are selected."},{id:"select-all",shot:F,locate:{role:"button",name:"Select all"},name:"Select all",does:"Selects every case in the suite."},{id:"case",shot:F,locate:{text:Dt},name:"Case",does:"One case, numbered by its place. Drag it to move it; a selected case carries the whole selection with it. Click to select it, [[Ctrl]]+click to add more, [[Shift]]+click for a range."},{id:"move",shot:F,locate:{role:"button",name:"Move #5001 down"},name:"Move up / down",does:"Moves the case, or the selection it belongs to, one place up or down."},{id:"selected",shot:ve,locate:{text:"1 selected"},name:"Selected",does:"How many cases are selected in this plan. A selection can take cases from several suites of the same plan; picking a case in another plan starts a new one."},{id:"clear-selection",shot:ve,locate:{role:"button",name:"Clear selection"},name:"Clear selection",does:"Clears the selection in every suite of the plan."},{id:"copy-to",shot:ve,locate:{role:"combobox",name:"Copy to"},name:"Copy to",does:"The suite to copy the selected cases into: the plan's root or one of its static suites. Type to search the list; the x empties the choice."},{id:"copy",shot:ve,locate:{role:"button",name:"Copy to suite"},name:"Copy to suite",does:"Adds the selected cases to the chosen suite. They stay in the suites they were in; a case can belong to many suites. It is greyed out until cases are selected and a suite is picked."},{id:"list-selected",shot:ve,locate:{text:"1 of 5 selected"},name:"Selected in this suite",does:"How many of this suite's cases are selected. **Clear** beside it clears the selection in this suite only."},{id:"a-z",shot:qe,locate:{role:"button",name:"A-Z groups"},name:"A-Z groups",does:"Puts every group's cases together and the groups in A to Z order."},{id:"collapse-groups",shot:qe,locate:{role:"button",name:"Collapse groups"},name:"Collapse groups",does:"Folds every group; **Expand groups** opens them all again."},{id:"group-fold",shot:qe,locate:{role:"button",name:"Collapse group Login"},name:"Group heading",does:"Click a group's heading or its arrow to fold it. [[Ctrl]]+click the heading to select or clear the whole group. Drag the heading to move the group as one block."},{id:"group-move",shot:qe,locate:{role:"button",name:"Move group Login down"},name:"Move group up / down",does:"Moves the whole group past the group above or below it."},{id:"suite-name",shot:Fe,locate:{role:"textbox",name:"Suite name"},name:"Suite name",does:"The new suite's name."},{id:"create-inside",shot:Fe,locate:{role:"combobox",name:"Create inside"},name:"Create inside",does:"Where the suite goes: the plan's root or another static suite, the only places Azure DevOps allows."},{id:"new-cancel",shot:Fe,locate:{role:"button",name:"Cancel"},name:"Cancel",does:"Closes the window without creating anything."},{id:"create",shot:Fe,locate:{role:"button",nameRe:"^Create suite"},name:"Create suite",does:"Creates the suite

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the project root on sys.path so `import app` resolves under a bare
# `pytest` run (CI), not just `python -m pytest` which adds CWD implicitly.
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Errors + pyflakes + warnings, tuned to the existing style:
#   E501 — GUI QSS f-strings routinely exceed the line limit
#   E731 — small lambdas are idiomatic for Qt signal wiring here
select = ["E", "F", "W"]
ignore = ["E501", "E731"]

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Case Manager</title>
    <style>
      /* Painted before any JS: no white flash, splash until React mounts. */
      html, body { margin: 0; height: 100%; background: #0f172a; }
      #splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: #0f172a; z-index: 9999;
      }
      #splash svg { width: 64px; height: 64px; stroke: #22c55e; fill: none;
        stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      #splash .flask-body { stroke-dasharray: 70; stroke-dashoffset: 70;
        animation: draw 1.1s ease-out forwards; }
      #splash .flask-top, #splash .flask-line { opacity: 0;
        animation: appear .4s ease-out .7s forwards; }
      #splash span { font: 600 13px 'Segoe UI', system-ui, sans-serif;
        color: #94a3b8; letter-spacing: .04em; opacity: 0;
        animation: appear .5s ease-out .9s forwards; }
      #splash::after { content: ''; width: 120px; height: 2px; border-radius: 2px;
        background: linear-gradient(90deg, transparent, #22c55e, transparent);
        background-size: 200% 100%; animation: sweep 1.2s linear infinite; }
      @keyframes draw   { to { stroke-dashoffset: 0; } }
      @keyframes appear { to { opacity: 1; } }
      @keyframes sweep  { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    </style>
  </head>

  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path class="flask-top" d="M9 3h6" />
        <path class="flask-body" d="M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3" />
        <path class="flask-line" d="M7.5 14h9" />
      </svg>
      <span>TEST CASE MANAGER</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

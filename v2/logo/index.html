<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Case Manager — Animated Logo</title>
    <style>
      /* Self-contained showcase of the sign-in screen's animated flask mark.
         Retint by changing --accent / --accent-soft below; everything else
         is derived. Matches src/index.css .login-flask + AnimatedFlask.tsx. */
      :root {
        --accent: #8b5cf6;
        --accent-soft: rgba(139, 92, 246, 0.25);
        --bg: #0e0c1c;
        --text: #e7e4f4;
        --muted: #a5a0c2;
        --size: 132px; /* flask svg size; the stage scales from it */
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(circle at 50% 42%, #1b1533, var(--bg) 70%);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      .login-flask {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: calc(var(--size) * 1.9);
        height: calc(var(--size) * 1.9);
        color: var(--accent);
      }
      .login-flask svg {
        position: relative;
        z-index: 2;
        width: var(--size);
        height: var(--size);
        animation: art-float 5s ease-in-out infinite;
        filter: drop-shadow(0 0 14px var(--accent-soft));
      }
      .login-flask .fl-body {
        stroke-dasharray: 70;
        stroke-dashoffset: 70;
        animation: lf-draw 1.4s ease-out forwards;
      }
      .login-flask .fl-top,
      .login-flask .fl-line {
        opacity: 0;
        animation: lf-appear 0.5s ease-out 0.9s forwards;
      }
      .login-flask .glow {
        position: absolute;
        inset: 16%;
        border-radius: 9999px;
        background: radial-gradient(circle, var(--accent-soft), transparent 65%);
        animation: lf-glow 3.2s ease-in-out infinite;
      }
      .login-flask .orbit {
        position: absolute;
        inset: 3%;
        border-radius: 9999px;
        border: 1px dashed color-mix(in srgb, var(--accent) 40%, transparent);
        animation: lf-spin 16s linear infinite;
      }
      .login-flask .orbit::before {
        content: "";
        position: absolute;
        top: -3px;
        left: 50%;
        width: 6px;
        height: 6px;
        border-radius: 9999px;
        background: var(--accent);
        box-shadow: 0 0 10px var(--accent);
      }
      .login-flask .orbit2 {
        inset: 13%;
        opacity: 0.6;
        animation-duration: 10s;
        animation-direction: reverse;
      }
      .login-flask .bubble {
        position: absolute;
        bottom: 69%; /* emit from the flask's mouth, not the body */
        left: 50%;
        z-index: 3;
        width: 6px;
        height: 6px;
        border-radius: 9999px;
        background: var(--accent);
        opacity: 0;
        animation: art-bubble 3.4s ease-in infinite 1.2s;
      }
      .login-flask .b2 { width: 4px; height: 4px; margin-left: -7px; animation-delay: 2.1s; }
      .login-flask .b3 { width: 5px; height: 5px; margin-left: 6px; animation-delay: 3s; }
      .login-flask .b4 { width: 3px; height: 3px; margin-left: -3px; animation-delay: 3.9s; }

      @keyframes lf-draw { to { stroke-dashoffset: 0; } }
      @keyframes lf-appear { to { opacity: 1; } }
      @keyframes lf-glow {
        0%, 100% { opacity: 0.5; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.06); }
      }
      @keyframes lf-spin { to { transform: rotate(360deg); } }
      @keyframes art-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      @keyframes art-bubble {
        0% { transform: translateY(0); opacity: 0; }
        15% { opacity: 0.7; }
        100% { transform: translateY(-70px); opacity: 0; }
      }

      .wordmark {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: var(--muted);
      }

      /* Accessibility: honor reduced-motion by settling to the final frame. */
      @media (prefers-reduced-motion: reduce) {
        .login-flask svg,
        .login-flask .glow { animation: none; }
        .login-flask .fl-body { animation: none; stroke-dashoffset: 0; }
        .login-flask .fl-top,
        .login-flask .fl-line { animation: none; opacity: 1; }
        .login-flask .orbit,
        .login-flask .bubble { display: none; }
      }
    </style>
  </head>

  <body>
    <div class="login-flask" role="img" aria-label="Test Case Manager logo">
      <span class="glow"></span>
      <span class="orbit"></span>
      <span class="orbit orbit2"></span>
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path class="fl-top" d="M9 3h6" />
        <path class="fl-body" d="M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3" />
        <path class="fl-line" d="M7.5 14h9" />
      </svg>
      <span class="bubble b1"></span>
      <span class="bubble b2"></span>
      <span class="bubble b3"></span>
      <span class="bubble b4"></span>
    </div>
    <span class="wordmark">TEST CASE MANAGER</span>
  </body>
</html>

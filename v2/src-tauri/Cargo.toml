[package]
name = "v2"
version = "1.17.8"
description = "Bulk-create and edit Azure DevOps Test Cases"
authors = ["Avin Alwis"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The bin has no tests of its own; test=false keeps `cargo test` from linking
# it as a test harness (which would double-embed the Windows manifest).
[[bin]]
name = "v2"
path = "src/main.rs"
test = false

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# All tests live in tests/ (integration targets) so they receive the
# Common-Controls v6 manifest from build.rs rustc-link-arg-tests; a lib
# unit-test binary would not and would crash at startup on Windows.
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: JSON objects keep the key order they were read in. The
# app patches files other people (and assistants) also edit - without it
# every save would reshuffle the file alphabetically and bury the real
# change in a diff full of noise. See import_parser::comments.
serde_json = { version = "1", features = ["preserve_order"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
thiserror = "2.0.18"
reqwest = { version = "0.13.4", features = ["form", "json", "native-tls", "blocking"], default-features = false }
sha2 = "0.11.0"
base64 = "0.22.1"
rand = "0.10.2"
urlencoding = "2.1.3"
quick-xml = "0.41.0"
regex = "1.13.0"
tauri-plugin-dialog = "2.7.1"
velopack = "1.2.0"
xcap = "0.9.6"
image = { version = "0.25.10", default-features = false, features = ["png"] }
futures = { version = "0.3.32", default-features = false, features = ["std", "async-await"] }
cpal = "0.18.1"
rustfft = "6.4.1"
tauri-plugin-clipboard-manager = "2.3.2"
# OS-level file change notification (ReadDirectoryChangesW on Windows) so a
# watched import file costs nothing while it sits still - see filewatch.rs.
notify = "8.2.0"
tauri-plugin-notification = "2.3.3"

# One window only. Desktop-only because the mechanism it uses (a named
# object the first process owns) has no meaning on mobile - see run().
[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
wiremock = "0.6.5"


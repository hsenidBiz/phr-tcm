[package]
name = "tauri-commands"
description = "Drop-in Tauri command handlers for the Crystal Reports editor backend"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Pulls the real #[tauri::command] attribute. Without it the module compiles as plain
# functions — for compile-checking outside a Tauri app (CI, consumer verification).
tauri = ["dep:tauri"]

[dependencies]
rpt-core = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", optional = true, default-features = false }
